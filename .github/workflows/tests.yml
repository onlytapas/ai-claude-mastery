name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and lint tools
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Build and audit
        run: python build.py

      - name: Built site matches the source
        run: git diff --exit-code -- docs/

      # Chrome is preinstalled on GitHub's Ubuntu runners, so the browser checks run here too.
      - name: Tests
        run: pytest
