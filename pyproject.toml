# Tool settings only: the book is built with the Python standard library (python3 build.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs", "share", "research", "notes"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, import order
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
